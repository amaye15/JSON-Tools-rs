version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # Pins predate the 2026-07-30 MSRV bump to 1.85 (for pyo3-arrow) and are left
      # in place conservatively rather than lifted as an incidental side effect of
      # that unrelated change -- revisit both in a dedicated dependency-bump pass.
      # See the pin comments on `indexmap`/`sonic-rs` in Cargo.toml.
      - dependency-name: "indexmap"
        versions: [">=2.12.0"]
      - dependency-name: "sonic-rs"
        versions: [">0.5.7"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
